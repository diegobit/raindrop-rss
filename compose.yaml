services:
  raindrop-rss:
    build:
      context: .
      platforms: [linux/amd64]      # the Geekom is amd64; the dev Mac is arm64
    image: raindrop-rss:1
    restart: unless-stopped
    # Run as the host user who owns config/, subscriptions/, data/ and the
    # Telegram credentials. Put RSS_UID/RSS_GID in .env; see the README.
    user: "${RSS_UID:-1000}:${RSS_GID:-1000}"
    ports:
      - "127.0.0.1:${RSS_PORT:-38471}:38471"   # reach it remotely over an SSH tunnel
    volumes:
      - ./config:/app/config:ro     # settings.toml and raindrop-token, mode 600
      - ./subscriptions:/app/subscriptions   # a directory, so atomic replace works
      - ./data:/app/data
      # Alerts are a host command (tg_command). Mount that program, and any
      # secret files it reads, from a gitignored compose.override.yaml.
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }
